[package]
name = "git-ignore"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "Append templates from github/gitignore to a local .gitignore file."
repository = "https://github.com/makotoshimazu/git-ignore"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
